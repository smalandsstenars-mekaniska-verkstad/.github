# The one alert that cannot live inside the monitoring stack: an observer outside
# the house. Every alert in OpenObserve is evaluated by the same process that
# would have to report that it is not running, and the hypervisor's VM health
# check has the same problem one level down - it watches the web VM from outside,
# then ships what it saw to the OpenObserve running inside that VM.
#
# GitHub is the outside observer we already pay for. A failed scheduled run
# emails the account that owns the workflow (Settings -> Notifications ->
# Actions, "Send notifications for failed workflows only"), so no new service is
# needed. It lives in this repository rather than in valentis-ansible because it
# watches the platform, not the provisioning of it.
#
# What it does NOT give: GitHub runs scheduled workflows on a best-effort basis,
# delays them under load, and disables schedules in a repository with no activity
# for 60 days. So this is a dead man's switch for an outage lasting tens of
# minutes, not a latency monitor - which is exactly the gap it is meant to close.
# The 60-day rule is documented for public repositories, which this one is, and
# only new commits reset the counter - a manual run or a release tag does not. In
# a repository this quiet that is the failure mode to watch: GitHub mails a
# warning some days ahead, and the schedule has to be re-enabled by hand after.
#
# The monitoring vhost is not in this file. The repository is public, and that
# host deliberately has no public DNS record - naming it here would spend that
# obscurity for nothing. It is a secret rather than a variable because the runner
# prints each step's env block before the step runs: an ::add-mask:: in the first
# step comes too late for that first block, while secrets are registered as masks
# at job start and read *** everywhere. The public site has nothing to hide and
# stays a variable, where its value can be read back in the UI.
#
#   vars.HEARTBEAT_SITE_URL     the public site to fetch, e.g. https://www.example.com/
#   secrets.HEARTBEAT_EDGE_HOST the monitoring vhost on the same edge
name: heartbeat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.HEARTBEAT_SITE_URL }}
      EDGE_HOST: ${{ secrets.HEARTBEAT_EDGE_HOST }}
    steps:
      # Fail on a missing value with the name of the one that is missing, rather
      # than letting curl run against an empty string three times and report a
      # site outage that is really a configuration mistake.
      - name: Check the configuration
        run: |
          [ -n "$SITE_URL" ] || { echo "vars.HEARTBEAT_SITE_URL is not set"; exit 1; }
          [ -n "$EDGE_HOST" ] || { echo "secrets.HEARTBEAT_EDGE_HOST is not set"; exit 1; }
          site_host=${SITE_URL#*://}
          site_host=${site_host%%/*}
          echo "SITE_HOST=$site_host" >> "$GITHUB_ENV"

      # The public site proves the whole chain from the internet: the VM is up,
      # Docker Swarm is up, proxy-public answers TLS and a web container renders.
      # OpenObserve runs on the same machine, so this failing means the alerts in
      # OpenObserve are not running either.
      - name: Public site answers
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL") || code=000
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            [ "$attempt" = 3 ] || sleep 20
          done
          echo "the public site did not answer 200 in three attempts"
          exit 1

      # The monitoring vhost has no public DNS record, so a runner cannot look it
      # up - which is why this resolves the public site instead and forces the
      # name onto the same edge address. SNI and Host then carry the vhost, the
      # wildcard certificate covers it, and nginx answers.
      #
      # 200 is required, and it is a check of OpenObserve rather than of nginx:
      # valentis-proxy v2.15.1 exempts GET /healthz from the vhost's allow-list,
      # so what answers here is the application behind the proxy. The exemption is
      # that one path only - a location's own allow replaces the server-level deny
      # instead of adding to it - measured from this workflow across the release:
      # 403 at 12:20, 200 at 12:45 on 2026-09-08, same URL, same runner network.
      #
      # The failure modes are therefore distinguishable in the log. 502 or 504:
      # nginx is up and OpenObserve is not, which is the blind spot the step above
      # admits, since the public site can render while monitoring is dead. 403: the
      # exemption is gone, so a proxy release rolled back the vhost. 000: nothing
      # answered on 443 at all.
      - name: Monitoring edge answers
        run: |
          edge_ip=$(getent ahostsv4 "$SITE_HOST" | awk '{print $1; exit}')
          [ -n "$edge_ip" ] || { echo "the public site's address did not resolve"; exit 1; }
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              --resolve "$EDGE_HOST:443:$edge_ip" "https://$EDGE_HOST/healthz") || code=000
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            [ "$attempt" = 3 ] || sleep 20
          done
          echo "the monitoring edge did not answer 200 in three attempts"
          exit 1
